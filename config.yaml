      seedvr2_source_dir: ''
      text_encoder:
        sub_dir: text_encoders
        sub_path: Qwen-Image-2.1/qwen3vl_8b_int8_convrot.safetensors
      unet:
        sub_dir: unet
        sub_path: ''
      vae:
        sub_dir: vae
        sub_path: ''
      model_id: Qwen/Qwen3-VL-8B
      local_model_dir: ''
      vram_gb: 11.0
      ram_gb: 32.0
      default_precision: int8
      fallback_precision: int8
      supported_features:
      - vlm_chat
      default_width: 1024
