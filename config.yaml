      license: Apache-2.0
      tags:
      - vlm
      - native
      - multimodal
      weight_sha256: ''
      weight_version: ''
      training_data_source: ''
      compatibility_matrix: {}
    qwen_image_native:
      name: qwen_image_native
      display_name: Qwen-Image 2.1 (原生文生图)
      display_name_en: Qwen-Image 2.1 (Native txt2img)
      backend: native
      workflow_file: ''
      parameter_schema: ''
      comfy_source_dir: comfy_kernel
      custom_nodes_dir: ''
      seedvr2_source_dir: ''
      text_encoder:
        sub_dir: text_encoders
        sub_path: Qwen-Image-2.1/qwen3vl_8b_int8_convrot.safetensors
      unet:
        sub_dir: unet
        # GOTCHAS（2026-10-02 实证）：本机 Qwen-Image-2.1 目录下只有这一个 UNET
        # （qwen_image_edit_native 也用它）。原写 `qwen_image_2.1_base_int8_convrot.safetensors`
        # 该文件不存在 → preflight 走 SKIPPED(2) 的离线阻断分支。实测
        # `comfy/ldm/qwen_image21/model.py` 的 QwenImage21Transformer2DModel.forward 里
        # ref_latents/image_slots 都是**可选**（默认 None），**同一份 UNET 既做 txt2img 也做 edit**，
        # 区别只在是否传参考图 latent；故这份权重可直接用于文生图。已实跑出图（512²/8 步/euler+simple，
        # 猫趴木桌，与 prompt 吻合）。
        sub_path: Qwen-Image-2.1/qwen_image_2.1_int8_convrot.safetensors
      vae:
        sub_dir: vae
        sub_path: Qwen-Image-2.1/qwen_image_2.1_vae_bf16.safetensors
      model_id: ''
      local_model_dir: ''
      vram_gb: 11.0
      ram_gb: 32.0
      default_precision: int8
      fallback_precision: int8
      supported_features:
      - txt2img
      default_width: 1024
      default_height: 1024
      # Qwen-Image 2.1 latent（与 edit 同架构，edit 块实测）：64 通道 / 16 下采样
      latent_channels: 64
      latent_downscale: 16
      # 2026-10-02 preflight 实证回填：候选 (euler/simple, euler/beta, euler/sgm_uniform,
      # dpmpp_2m/simple) 中 euler+simple 首个即出图（512²/8 步/采样 18.5s，落盘
      # outputs/_preflight_qwen_image/qwen_euler_simple.png，与 prompt 吻合）。
      sampler: euler
      scheduler: simple
      image_formats:
      - png
      license: Apache-2.0
      tags:
      - txt2img
      - native
      - qwen-image
      weight_sha256: ''
      weight_version: ''
      training_data_source: ''
      compatibility_matrix: {}
    krea2_turbo_native:
      name: krea2_turbo_native
      display_name: Krea2-turbo (原生文生图)
      display_name_en: Krea2-turbo (Native txt2img)
      backend: native
      workflow_file: ''
      parameter_schema: ''
      comfy_source_dir: comfy_kernel
      custom_nodes_dir: ''
      seedvr2_source_dir: ''
      text_encoder:
        sub_dir: text_encoders
        # GOTCHAS（2026-10-02 实证）：Krea2 的 TE 是 Qwen3-VL-4B，必须走 CLIPType.KREA2
        # **枚举**（值 32）。``comfy/sd.py`` 的分支条件是
        # ``clip_type == CLIPType.KREA2 and te_model == TEModel.QWEN3VL_4B``；只判 clip_type
        # 会按**单层 2560 维**建 TE，前向报 `expects 12x2560=30720 features ... but got 2560`。
        # 传字符串 "krea2" **不等于**枚举，同样失败——config 里写 `krea2` 是由 executor
        # ``_load_text_encoder`` 用 ``getattr(CLIPType, "KREA2")`` 转成枚举再下发。
        sub_path: Krea2/qwen3-vl-4b-heretic_fp8_e4m3fn.safetensors
        clip_type: krea2
      unet:
        sub_dir: unet
        # GOTCHAS（2026-10-02 实证）：同目录的 `krea2_turbo_fp8_scaled.safetensors`（12.24 GiB）
        # safetensors 0.8.0 rust 后端打不开（MetadataIncompleteBuffer / file not fully covered），
        # 逐项对照实验排除 junction/体积/头覆盖/_quantization_metadata 后确认是该文件自身的
        # fp8 描述符问题；AIO 那份（16.61 GiB）``load_torch_file`` 正常。故只用 AIO 这份。
        sub_path: Krea2-turbo/krea2TurboNSFWAIO_v10.safetensors
        # AIO checkpoint 的键带 `model.diffusion_model.` 前缀，加载前必须剥掉
        # （executor `_load_diffusion_model`，见 GOTCHAS #41）。
        key_prefix: model.diffusion_model.
      vae:
        sub_dir: vae
        sub_path: Krea2/qwen_image_vae.safetensors
      model_id: ''
      local_model_dir: ''
      vram_gb: 12.0
      ram_gb: 32.0
      default_precision: fp8
      fallback_precision: fp8
      supported_features:
      - txt2img
      default_width: 1024
      default_height: 1024
      # Krea2 的 latent_format 是 `latent_formats.Wan21`：`latent_channels=16`、
      # 时间维 t=1、空间下采样 8（`/c/.../comfy/latent_formats.py` 里 Wan21 没有
      # spacial_downscale_ratio 属性，空间倍率在 comfy_extras/nodes_wan.py 写死为 //8）。
      # 造 latent 必须是 **5D [1,16,1,H/8,W/8]**；造 4D 会被当 16 个时间帧 → 出 61 帧废图。
      latent_channels: 16
      latent_downscale: 8
      # 2026-10-02 preflight 实证回填：euler+simple 512²/4 步端到端出图
      # （outputs/_preflight_krea2/krea2_euler_simple.png，猫坐木桌，与 prompt 吻合）。
      sampler: euler
      scheduler: simple
      image_formats:
      - png
      license: Apache-2.0
      tags:
      - txt2img
      - native
      - krea2
      weight_sha256: ''
      weight_version: ''
      training_data_source: ''
      compatibility_matrix: {}
    flux1_dev_native:
      name: flux1_dev_native
      display_name: FLUX.1-dev（原生文生图）
      display_name_en: FLUX.1-dev (Native txt2img)
      backend: native
      workflow_file: ''
      parameter_schema: ''
      comfy_source_dir: comfy_kernel
      custom_nodes_dir: ''
      seedvr2_source_dir: ''
      text_encoder:
        sub_dir: text_encoders
        # GOTCHAS（2026-10-02 实证）：FLUX.1-dev 是**双文本编码器**架构，t5xxl（220 键、
        # fp8_e4m3fn）与 clip_l（196 键、fp16）必须**一次 load_clip 同时传两个文件**，
        # 少传任一个前向会报 t5 维数不符。clip_l 在本机 ComfyUI 库挂在 models/clip/ 下、
        # 与 t5xxl 的 models/text_encoders/ 不同目录，故用 sub_paths 让附加项自带 sub_dir。
        sub_path: FLUX-1-dev/t5xxl_fp8_e4m3fn.safetensors
        clip_type: flux
        sub_paths:
        - sub_dir: clip
          sub_path: FLUX.1-dev/clip_l.safetensors
      unet:
        sub_dir: unet
        # GOTCHAS（2026-10-02 实证）：本机 unet/FLUX-1-dev 下共 4 份 ~11.9GB，选
        # fluxNSFWUNLOCKED —— fp8 E4M3 精度档位正常，且键带 `model.diffusion_model.`
        # 前缀、可直接复用剥前缀逻辑；Flux-Capacity-NSFW-V2-fp8 是 E5M2（尾数仅 3 位、
        # 精度更差），另两份（pornworks*）是裸键无前缀。roadmap 曾把该目录标为
        # 「未开工/权重阻断」，实际权重一直都在本机库里，只是没建 junction + 没写 config。
        sub_path: FLUX-1-dev/fluxNSFWUNLOCKED.safetensors
        key_prefix: model.diffusion_model.
      vae:
        sub_dir: vae
        # 注意 junction 名是 `FLUX.1-dev`（点号）不是 `FLUX-1-dev`（连字符）。
        # GOTCHAS #43：拼错在语法上完全合法、resolve 也照样拼出绝对路径，直到
        # load 时 verify_weight_before_load 才发现文件不存在——必须靠 preflight /
        # resolve 探针逐条 exists 兜住。
        sub_path: FLUX.1-dev(Z-image(turbo))/ae.safetensors
      model_id: ''
      local_model_dir: ''
      vram_gb: 12.0
      ram_gb: 32.0
      default_precision: fp8
      fallback_precision: fp8
      supported_features:
      - txt2img
      default_width: 1024
      default_height: 1024
      # GOTCHAS（2026-10-02 实证）：latent_formats.Flux 继承 SD3 —— latent_channels=16、
      # 空间下采样 8；且 FLUX 是 2D 图像模型，latent 是 **4D [1,16,H/8,W/8]**，
      # 与 Krea2/Wan21 的 5D [1,16,1,H/8,W/8] 不同（造 5D 会被当成时间帧）。
      latent_channels: 16
      latent_downscale: 8
      # FLUX 的 guidance 与 cfg 是**两套**参数：guidance 由 model_base.Flux.concat_cond
      # 从 cond 字典的 guidance 键取（缺省 3.5），cfg 只管双分支权重。原生 executor 里
      # 没有 comfy_extras 的 Guidance 节点，故由 _encode_conditioning 手工注入。
      guidance: 3.5
      # 2026-10-02 preflight 实证回填：256²/4 步 euler+simple / guidance 3.5 端到端出图
      # （outputs/_preflight_flux1_dev/flux1_euler_simple.png，猫趴木桌，与 prompt 吻合）。
      # 引擎默认 1024² 尚未实跑（与 qwen_image/krea2 同口径）。
      sampler: euler
      scheduler: simple
      image_formats:
      - png
      license: Apache-2.0
      tags:
      - txt2img
      - native
      - flux
      weight_sha256: ''
      weight_version: ''
      training_data_source: ''
      compatibility_matrix: {}
inference:
  default_steps: 10
  default_cfg: 1.0
  default_sampler: dpmpp_3m_sde_gpu
  default_scheduler: sgm_uniform
  default_seed: -1
  default_batch_size: 1
  default_format: png
  default_quality: 95
  enable_fp8_fallback: true
  vram_headroom_gb: 2.0
  vram_multisample_rule: 1.5
  vram_tight_continue: true
  torch_compile:
    enabled: false
    backend: inductor
    dynamic: true
    mode: default
  lora_max_units: 6
output:
  base_dir: outputs
  naming_template: '{engine}_{date}_{taskid}_{seed}_{idx}'
  organize_by: engine_date
  image_format: png
  image_quality: 95
  save_thumbnail: true
  thumbnail_format: png
  thumbnail_quality: 90
  thumbnail_max_side: 512
  history:
    db_path: data/history.db
    max_records: 50000
    keep_days: 0
    max_gb: 10.0
    cleanup_cron: 0 3 * * *
  uploads:
    cache_dir: data/uploads
    max_size_mb: 2000
    max_pixels: 200000000
    ttl_s: 86400
presets:
  dir: data/presets
  allow_engine_mix_presets: true
watermark:
  enabled_in_code: true
  method: dct_frequency
  product_id: IMGMULTI-1
  embed_timestamp: true
  embed_task_id: true
  strength: 0.008
  failure_mode: sidecar
runtime:
  task_queue:
    maxsize: 100
    worker_mode: single_serial
    cancel_timeout_s: 5
    auto_recover: false
    max_timeout_s: 86400
    id_format: ulid
    checkpoint_every: 100
    checkpoint_dir: data/checkpoints
  batch:
    max_retries: 2
    retry_base_delay_s: 1.0
    retry_max_delay_s: 30.0
    stop_on_error: false
  sse:
    poll_interval_s: 0.5
    heartbeat_interval_s: 30
    max_duration_s: 3600
    preview_b64_max_width: 256
  vram_scheduler:
    enabled: false
    vram_high_watermark_pct: 90
    vram_low_watermark_pct: 70
    sample_interval_s: 0.5
    max_batch_size: 4
    min_batch_size: 1
  idle_unload_minutes: 0
security:
  allowed_base_dirs:
  - outputs/
  - data/
  - workflows/
  - pretrained_models/
  image_read_base_dirs:
  - outputs/
  - data/
  rate_limit:
    infer_per_minute: 6
    upload_per_minute: 10
    global_per_minute: 600
  basic_auth:
    enabled: false
    username: admin
    password_bcrypt_hash: ''
  api_token:
    enabled: false
    tokens:
    - REPLACE_WITH_YOUR_BEARER_TOKEN_32BYTES
    bootstrap: false
  csrf:
    enabled: true
  cors:
    allowed_origins:
    - http://127.0.0.1:8288
    - http://localhost:8288
    - ws://127.0.0.1:*
    allow_credentials: true
  model_format:
    only_safetensors: true
    warn_if_pickle_found: true
    verify_weights: true
    weight_manifest_file: data/weight_manifest.json
    fail_closed_on_corrupt_weight: true
    allow_unregistered_weights: true
  integrity_selfcheck:
    enabled: true
    manifest_file: app/integrated_app/security/integrity_manifest.json
    enforce: true
  content_filter:
    fail_closed_on_clip_missing: true
  headers:
    enabled: true
    csp: ''
gpu:
  backend: auto
  device_ids:
  - 0
  allow_fallback_to_cpu: true
  low_vram_mode: auto
  monitor:
    sample_interval_s: 2
    history_points: 60
ui:
  theme_default: light
  accent_color: '#5e7d5a'
  font_pair: instrument_serif_dm_sans
  sidebar_collapsed_by_default: false
  accordion_default_groups:
  - basic
  - prompt
  history_page_size: 50
  preview_max_size_mb: 20
  a11y:
    focus_ring: true
    reduce_motion: false
i18n:
  default_locale: zh
  available_locales:
  - zh
  - en
  - ja
  - ko
  - zh-tw
  locale_dir: app/integrated_app/locales
  fallback_to_en: true
logging:
  level: INFO
  file: logs/app.log
  max_size_mb: 50
  backup_count: 5
  include_traceback: true
  mask_sensitive_headers: true
cache:
  dir: data/cache
  max_size_mb: 500
  ttl_s: 86400
acceleration:
  vllm:
    enabled: false
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.85
  tensorrt:
    enabled: false
    engine_cache_dir: data/trt_engines
environment:
  HF_HUB_OFFLINE: '1'
  TRANSFORMERS_OFFLINE: '1'
  MODELSCOPE_OFFLINE: '1'
  COMFYUI_DISABLE_UPDATE_CHECK: '1'
finops:
  budget_gpu_hours_per_day: 0.0
  storage_gb_budget: 10.0
  alert_level: warning
