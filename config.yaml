      text_encoder:
        sub_dir: text_encoders
        sub_path: FLUX-2-klein-9b/qwen_3_8b_fp8mixed.safetensors
      unet:
        sub_dir: unet
        sub_path: FLUX-2-klein-9b/BigLoveKlein2_fp8.safetensors
      vae:
        sub_dir: vae
        sub_path: FLUX.2-klein-9b/flux2-vae.safetensors
      model_id: ''
