# Auto-generated structure-guard baseline.
# root_allowlist freezes the approved root layout.
# To deliberately permit a new root file, add it to root_allowlist.
# forbid_root_patterns fail CI on future stray dumps
# (audit / review / log / temp files at repo root).
version: 1
require_dirs:
  - docs
  - scripts
  - .github
forbid_root_patterns:
  - '.*_AUDIT_.*\.md$'
  - '.*_ASSESSMENT_.*\.md$'
  - '.*_REVIEW_.*\.md$'
  - '.*_REPORT.*\.md$'
  - 'REMEDIATION_EXECUTION_LOG.*\.md$'
  - 'REVISION_LOG.*\.md$'
  - '.*_EXECUTION_SUMMARY.*\.md$'
  - '.*_报告_.*\.md$'
  - '.*评估.*\.md$'
  - '.*审查.*\.md$'
  - '.*_release_log.*\.txt$'

# 产物类（会自行再生的构建/测试垃圾）：仅 WARN 不阻断，由 auto_tidy 归位
artifact_root_patterns:
  - '.*\.log$'
  - '.*\.tmp$'
  - '.*\.bak$'
  - 'coverage\.xml$'
  - 'tmp_.*'
  - '.*~$'
gitignored_expect:
  - coverage.xml
  - .coverage
  - node_modules
  - __pycache__
  - .venv
  - .venv_srv
  - dist
  - build
  - .mypy_cache
  - .pytest_cache
  - .ruff_cache
  - .hypothesis
  - .torch_cache
  - .trae
  - .idea
  # .qoder 于 2026-10-06 起改为「.qoder/* + !.qoder/rules/」：规则层随仓库分发（干净克隆 / CI
  # 检出的 agent 指令入口），目录不再整体被忽略；保留此期望只会产生误导性 WARN。
  - htmlcov
  - .gradle
  - .kotlin
  - .vscode
  - playwright-report
  - test-results
  - dogfood-output
  - android-sdk
  - artifacts
  - coverage
root_allowlist:
  - .dockerignore
  - .env.example
  - .gitattributes
  - .githooks
  - .github
  - .gitignore
  - .mailmap
  - .pre-commit-config.yaml
  # 2026-10-06：.qoder/rules/（可分发 agent 基线指令层）入库后，.qoder 不再是“完全本地”条目，
  # 显式登记到 allowlist（其余 .qoder/* 子项仍由 .gitignore 忽略）。
  - .qoder
  - CHANGELOG.md
  - Dockerfile
  - LICENSE
  - NOTICE
  - PRIVACY_POLICY.md
  - README.md
  - SECURITY.md
  - THIRD_PARTY_NOTICES.md
  - USER_AGREEMENT.md
  - app
  - config.yaml
  - data
  - demo
  - docker-compose.bluegreen.yml
  - docker-compose.release.yml
  - docker-compose.yml
  - docs
  - install.bat
  - install.sh
  - model
  - precheck.ps1
  - pyproject.toml
  - release
  - release-signing-public-key.asc
  - requirements-lock.txt
  - requirements.txt
  - scripts
  - start.bat
  - start.sh
  - tests
