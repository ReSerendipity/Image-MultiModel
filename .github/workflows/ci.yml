name: CI

on:
  # ⚠️ 这里刻意【不加】paths / paths-ignore。main 的 required status checks 现共 5 个
  #   （唯一权威来源：GET /repos/<repo>/branches/main/protection/required_status_checks
  #    —— 这个集合会变，2026-09 内就从 4 个变成 5 个，别拿本注释当准，去查线上）：
  #     1. Lint & Compile Check                          ← 本文件 jobs.lint
  #     2. Test + Coverage (Python 3.12)                 ← 本文件 jobs.test（matrix 渲染）
  #     3. Typecheck (mypy ratchet) / Typecheck (mypy ratchet)
  #                                                    ← 本文件 jobs.typecheck 调用组织复用流
  #     4. Lock Solvability (pip resolver dry-run)       ← 本文件 jobs.lock-solvability
  #     5. DCO Check                                     ← 【dco.yml】jobs.dco，只在
  #          pull_request 产出（push/schedule 不产出，因 strict=false 不阻塞 main）。
  #          别因为它不在本文件就给它加 paths：它在所有 PR 上都必须跑。
  #   一旦按文件路径过滤，改文档/改 demo 的 PR 就不会产生这些 context，分支保护会把它们
  #   算成 "Expected — waiting" 并永久卡死（本仓 2026-09 踩过）。
  #   收益侧也测过了：其余 14 个 workflow 里最贵的 security.yml 才 5.8 job-min/PR 且已带
  #   paths，codeql 1.3、gitleaks/structure-guard/dco/self-purify 各 ~0.1，全部加起来
  #   < 0.5 job-min/PR，占本文件 23.5 job-min/PR 的 2% —— 不值得为此在任何地方开 paths
  #   白名单。要加过滤，先确认它不在这 5 个 context 的产路上（含 dco.yml 那条）。
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # 每日 UTC 02:00（北京时间 10:00）运行全量测试
    - cron: "0 2 * * *"

# 组名带 event_name：schedule（每日 02:00 夜间全量，且是 3.13 唯一稳定覆盖）与
# push-to-main 的 ref 同为 refs/heads/main，只按 ref 分组时一次 merge 就会取消在跑的
# 夜间 run —— 表现不是红，而是当晚覆盖静默消失、CI 依旧绿。口径同 #100。
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read

jobs:
  # runner 镜像策略（审计 P0-1 第二步，2026-09-25）：本文件里所有随 PR / main push 跑的 job
  # 一律钉 ubuntu-24.04，不让 2026-10-19 的 ubuntu-latest→Ubuntu 26 迁移静默改变结论。
  # 最硬的一条是 e2e：仓库里那份 homepage.linux-chromium.png 基线是在 24.04 镜像上生成的，
  # 换 OS 等于换字体栅格化，视觉回归会把环境差异误报成 UI 回归；performance 的 P95 阈值同理
  # （runner 调度特征会变）。26 的实测交给仍未钉的 18 个 job 当金丝雀（security / codeql /
  # gitleaks 等，理由见 PR 描述），到期后用一笔独立解钉探针 PR 观察，不在此顺带做。
  lint:
    name: Lint & Compile Check
    runs-on: ubuntu-24.04  # P0-1 第一步：required context 所在 job 钉死镜像，见 on: 注释
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-lint-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-lint-
      - run: pip install ruff
      - run: ruff check app/ tests/ scripts/

  # 类型门禁（家族底线；2026-09-03 接入组织级 reusable workflow）
  # 门禁逻辑统一维护在 ReSerendipity/.github 的 python-quality-baseline.yml。
  # 本仓不建 .ci/mypy_baseline.txt：模板对缺失基线走零容忍（迁移前实测两种
  # 口径均 0 错误——纯 mypy 与全依赖 venv 都是 0，见迁移记录），任何新类型
  # 错误即红。口径差异：原 job 还装了全量 requirements.txt 并显式传
  # --python-version 3.12；前者实测对结果无影响（两口径同为 0），后者由
  # pyproject [tool.mypy].python_version 提供，模板运行时会读取同一配置。
  #（原内联实现见 git 历史；迁移记录 docs/reports/mypy-ratchet-组织级门禁迁移_20260903.md）
  typecheck:
    name: Typecheck (mypy ratchet)
    # 原 mypy job 带 if: always()（lint/test 失败也出类型状态），迁移保留该语义
    if: always()
    uses: ReSerendipity/.github/.github/workflows/python-quality-baseline.yml@main
    with:
      package: app/integrated_app
      include_tests: false
      mypy_target: app/integrated_app
      pip_cache_dependency_path: requirements.txt
    permissions:
      contents: read

  test:
    name: Test + Coverage (Python ${{ matrix.python-version }})
    # 3.12 = 每个 PR 的必需门禁（context 名 "Test + Coverage (Python 3.12)" 精确
    # 挂在 branch protection 的 required 列表上，改一个字就会永远 "Expected"）。
    # 仍走 matrix 只是为了让 job 名保持这个历史形状，事件口径一字未动。
    runs-on: ubuntu-24.04  # P0-1 第一步：required context 所在 job 钉死镜像，见 on: 注释
    timeout-minutes: 60
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.12
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.12-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.12-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
          pip install pytest-cov pytest-asyncio pytest-timeout pytest-xdist hypothesis factory-boy
      - name: Marker usage check (declared vs used)
        # 测试体系评估 2026-09-04：--strict-markers 只拦"未声明就使用"，
        # 不拦"声明却无人使用"（-m 筛选静默失效）。此哨兵拦后者。
        run: |
          python scripts/check_marker_usage.py
      - name: Run tests with coverage (parallel)
        # 测试失败必须阻断 CI（对应测试体系评估 P0-1：移除 `|| true`，使覆盖率红线真正生效）
        # --junitxml：pytest 汇总行只有 "N passed, M skipped"，xdist 的 SKIPPED 行又只给
        # 节点 ID、不含 skip 原因（实测 job 107976134486）；原因只存在于 junit 的
        # <skipped message=…> 里，skip 配额门禁必须靠它，故这里落一份 XML。
        run: |
          python -m pytest \
            --cov=app/integrated_app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-junit.xml \
            -n auto \
            -v
      - name: Junit skip-quota gate
        if: always()
        # 台账 .github/ci_skip_ledger.python-3.12.json：精确相等、双向防漂移；
        # 台账自带 python_version，接错文件会当场拒跑（3.12/3.13 只差文件名）。
        # 两份台账各自绑定自己的产物（3.13 见 test-313 里的同名步骤）：当前分布相同
        # 是观测结果，不是互相背书的理由。
        run: |
          python scripts/check_junit_results.py \
            --junit test-junit.xml \
            --ledger .github/ci_skip_ledger.python-3.12.json
      - name: Coverage Gate (>= 65%, target 75%)
        if: always()
        run: |
          python - <<'PYEOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists('coverage.xml'):
              raise SystemExit('[FAIL] coverage.xml not found - 测试未运行或未采集覆盖率，门禁必须失败')
          rate = float(ET.parse('coverage.xml').getroot().get('line-rate'))
          pct = rate * 100
          print(f'Line coverage: {pct:.1f}%')
          # 65% = 落地红线（带安全余量）：实测约 69.4%，回落到 65% 给新增未测试
          # 模块留出余量，避免 CI 误红；
          # 75% 为目标值，待 CI 具备 torch/comfy 且新模块补齐测试后上调
          #（需同步 pyproject.fail_under）。
          if pct < 65:
              raise SystemExit(f'[FAIL] coverage {pct:.1f}% < 65%')
          print('[PASS] coverage meets 65% threshold (target: 75%)')
          PYEOF
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload junit results (skip 配额台账数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-3.12
          path: test-junit.xml
          if-no-files-found: error


  test-313:
    name: Test + Coverage (Python 3.13)
    # 3.13 不在 required 列表（gh api branches/main/protection/required_status_checks
    # 复核过：四个 required context 里只有 3.12 那一个），所以从 PR 摘掉不会造成
    # "expected but never run"。改为只在「非 PR 事件」跑：每日 UTC 02:00 schedule
    # 一次 + 每次合入 main 一次，兼容性覆盖没丢，只是不再占用 PR runner。
    # 实测口径：这一份 = 2.8 job-min/PR，近 30 天 75 次 PR 运行 ≈ 3.5 job-小时/月。
    #
    # 刻意不写成「matrix + job 级 if」：jobs.<job_id>.if 的可用上下文只有
    # github/needs/vars/inputs/secrets，不含 matrix —— 那样写整份 ci.yml 解析失败，
    # 症状是 Actions 生成一条以文件路径命名、零 job 的红色运行，四个 required
    # context 全部不产出（本 PR 的第一版就是这么试出来的）。
    # 因此这里与 test 保持同构步骤体（只有版本号与事件门禁两处差异）：
    # 改测试步骤时两处必须同改。
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.13
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-3.13-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-3.13-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
          pip install pytest-cov pytest-asyncio pytest-timeout pytest-xdist hypothesis factory-boy
      - name: Marker usage check (declared vs used)
        # 测试体系评估 2026-09-04：--strict-markers 只拦"未声明就使用"，
        # 不拦"声明却无人使用"（-m 筛选静默失效）。此哨兵拦后者。
        run: |
          python scripts/check_marker_usage.py
      - name: Run tests with coverage (parallel)
        # 测试失败必须阻断 CI（对应测试体系评估 P0-1：移除 `|| true`，使覆盖率红线真正生效）
        # --junitxml：pytest 汇总行只有 "N passed, M skipped"，xdist 的 SKIPPED 行又只给
        # 节点 ID、不含 skip 原因（实测 job 107976134486）；原因只存在于 junit 的
        # <skipped message=…> 里，skip 配额门禁必须靠它，故这里落一份 XML。
        run: |
          python -m pytest \
            --cov=app/integrated_app \
            --cov-report=xml \
            --cov-report=term-missing \
            --junitxml=test-junit.xml \
            -n auto \
            -v
      - name: Junit skip-quota gate (3.13)
        if: always()
        # 台账来自 push run 36146886840 的真实产物 junit-python-3.13（id 10869728441）：
        # 1061 用例 / 891 执行出结论 / 170 skip / 0 失败，8 个去重原因，与 3.12 逐条相同。
        # 3.13 只在 push / 夜间真跑（PR 事件按 #98 设计直接 skipped），所以这道闸的反馈
        # 周期是"合入即验"、不挡 PR；一旦红，说明出现了 3.12 上没有的版本相关 skip 漂移。
        run: |
          python scripts/check_junit_results.py \
            --junit test-junit.xml \
            --ledger .github/ci_skip_ledger.python-3.13.json
      - name: Coverage Gate (>= 65%, target 75%)
        if: always()
        run: |
          python - <<'PYEOF'
          import os, xml.etree.ElementTree as ET
          if not os.path.exists('coverage.xml'):
              raise SystemExit('[FAIL] coverage.xml not found - 测试未运行或未采集覆盖率，门禁必须失败')
          rate = float(ET.parse('coverage.xml').getroot().get('line-rate'))
          pct = rate * 100
          print(f'Line coverage: {pct:.1f}%')
          # 65% = 落地红线（带安全余量）：实测约 69.4%，回落到 65% 给新增未测试
          # 模块留出余量，避免 CI 误红；
          # 75% 为目标值，待 CI 具备 torch/comfy 且新模块补齐测试后上调
          #（需同步 pyproject.fail_under）。
          if pct < 65:
              raise SystemExit(f'[FAIL] coverage {pct:.1f}% < 65%')
          print('[PASS] coverage meets 65% threshold (target: 75%)')
          PYEOF
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
      - name: Upload junit results (skip 配额台账数据源)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-python-3.13
          path: test-junit.xml
          if-no-files-found: error

  sast:
    name: SAST - pip-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-sast-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-sast-
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Run pip-audit (SCA) — blocks CI on high-severity CVEs
        run: |
          pip-audit -r requirements.txt --strict

  smoke:
    name: Smoke Tests
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-smoke-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-smoke-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip check
          pip install pytest-cov pytest-asyncio
      - name: Run smoke tests (core critical path)
        run: |
          python -m pytest \
            tests/test_config.py \
            tests/test_path_guard_attacks.py \
            tests/test_system_routes.py \
            tests/test_api_contract.py::TestBasicContract::test_health_ok \
            tests/test_api_contract.py::TestBasicContract::test_config_ok \
            -v

  frontend-smoke:
    name: Frontend Smoke Tests (jsdom)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install Python dependencies
        # 去掉 `|| true`：实测本步骤当前在 runner 上成功（2026-09-24 CI run
        # 35950085383 全量 requirements.txt 装入无 ERROR），容错只会把
        # 「依赖装坏」压成一条警告，后面的 jsdom 断言照样报绿。
        run: |
          pip install -r requirements.txt
          pip install jinja2
      - name: Install Node dependencies
        run: |
          cd tests
          npm install
      - name: Render Jinja2 templates
        # 渲染失败必须红：smoke.js 第 85 行直接 fs.readFileSync(_rendered/index.html)，
        # 没有 _rendered/ 就抛异常退出 —— 所以旧文案 "creating minimal HTML" 从来不是真的
        # （没有任何人创建兜底 HTML），把它留在 `|| echo` 里只会把排障方向带偏。
        # 同时删掉紧随其后的 `cp app/integrated_app/static/index.html … || true`：该文件
        # 不在库里（static 下只有 css/js/icons/favicon），这行永远失败并被吞掉；而一旦将来
        # 真出现该文件，它会把刚渲染好的 _rendered/index.html 覆盖成未渲染版。
        run: |
          python scripts/render_pages.py
          mkdir -p tests/frontend/_rendered
      - name: Run frontend smoke tests (jsdom)
        run: |
          node tests/frontend/smoke.js
      # Agent 对话面板（chat.js）冒烟：覆盖 /api/tasks/{id} 的 history_db 行结构
      # 兼容（小写 status + outputs[].path）与 SSE 分片解码，无需模板渲染。
      - name: Run agent chat panel tests (jsdom)
        run: |
          node tests/frontend/agent_chat.js
      # M-06 XSS 转义回归（纯 Node，无 jsdom 依赖）。
      # 此前 CI 只跑 smoke.js，这份安全回归测试从未被纳入流水线。
      - name: Run frontend XSS regression
        run: |
          node tests/frontend/xss_regression.js

  e2e:
    name: E2E Tests (Playwright)
    # 对应测试体系评估 P1-4：启用 E2E + 视觉回归（此前 if:false 禁用）。
    # 以 IMM_FAKE_ENGINE=1 启动服务端，首页/结构/视觉回归无需 GPU，可 CI 复现；
    # 真实 GPU 生成用例标记 @pytest.mark.slow，默认不跑（手动冒烟）。
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-e2e-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-e2e-
      - name: Install Python dependencies
        # 不加 `|| true`：依赖装不上时 e2e 会以「playwright 未装 → 整目录 skip」
        # 的形式报绿，属假绿。实测本步骤当前在 runner 上成功（torch 2.14.0 等
        # 全量装入，85s），去掉容错不会误红。
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-playwright
      - name: Install Playwright browsers
        run: |
          python -m playwright install chromium --with-deps
      # 视觉回归基线按「平台-浏览器」分桶（字体渲染跨 OS 差异大，共用基线必假阳性）。
      # 现在 homepage.linux-chromium.png 已随仓库提交，缓存只剩一个身份：加速 +
      # 让「本次 UI 与 key 一致」的比对优先用当次生成的基线。
      # ⚠️ 故意【不配 restore-keys】。两理由：
      #   (1) 前缀匹配会把「渲染输入已经变了」的旧基线盖到检出里那份新基线上，
      #       比对口径被静默换成过期版本；
      #   (2) 指望缓存长期可恢复是不成立的——实测 2026-09-24 main 上两次 push
      #       （28787ce → 5b81335）间隔 15 分钟，前一次刚存下的
      #       Linux-e2e-snapshots-3da33d12… 与 3.2GB 的 Linux-pip-e2e-… 后一次
      #       全部 "Cache not found"：本仓 pip 缓存体积早已顶穿 Actions 10GB 配额，
      #       条目在运行之间就被回收。基线入库才是确定性的来源。
      - name: Cache visual regression baselines
        id: vrbaseline
        uses: actions/cache@v4
        with:
          path: tests/e2e/__snapshots__
          # 键必须覆盖「首页最终渲染出来的全部输入」。此前只 hash 模板，改
          # js/css/翻译时缓存键不动，CI 会继续拿旧基线去比对已经变样的页面。
          key: ${{ runner.os }}-e2e-snapshots-${{ hashFiles('app/integrated_app/templates/index.html', 'app/integrated_app/static/**', 'demo/index.html', 'app/integrated_app/locales/*.json') }}
      - name: Report baseline provenance
        # 取证缺口修复：整体未命中时 actions/cache 不写 outputs，日志里两行 echo 打成
        # 空串（实测 run 35971537640 与 35972536401 都是 `cache-hit=` / `primary-key=`
        # 后面什么都没有），于是"没有输出"和"输出是 false"在日志里长得一样。
        # ⚠️ 这里刻意【不用】 `${{ outputs.x || '默认' }}`：表达式里 false 也是假值，
        #    restore-key 命中那次 cache-hit 明明是 false，却会被换成"未命中"文案，
        #    等于把取证做成了造假。改在 shell 层用 ${var:-…} 兜底：只有真的渲染成空串
        #    才显示 <unset>。
        # primary-key / match-key 在 actions/cache@v4 下实测【从不产出】——注意
        # run 36003155514 是 cache-hit=true 的精确命中，那两行照样是 <unset>。所以
        # 命中与否一律以 cache-hit 为准；这两行保留的价值是把"该版本根本不写这两个
        # output"变成日志里可读的事实，而不是留一行空串让下个人以为是没命中。
        run: |
          hit='${{ steps.vrbaseline.outputs.cache-hit }}'
          pk='${{ steps.vrbaseline.outputs.cache-primary-key }}'
          mk='${{ steps.vrbaseline.outputs.cache-match-key }}'
          echo "cache-hit=${hit:-<unset: 该步骤未写 outputs＝整体未命中>}"
          echo "primary-key=${pk:-<unset: @v4 实测不产出该 output>}"
          echo "match-key=${mk:-<unset: @v4 实测不产出该 output>}"
          ls -l tests/e2e/__snapshots__ || echo "(工作区无基线目录)"
      # P0-1 的 90×1s 有界轮询口径：sleep 固定值 + 单次 curl 有两类病 ——
      # 冷启动慢于 5s 就误红，启动崩溃但端口被残留进程应答就误绿。
      - name: Start application in background (fake engine, no GPU)
        env:
          IMM_FAKE_ENGINE: "1"
        run: |
          python app/clean_launch.py > launch.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8288/api/health 2>/dev/null | grep -q "ok"; then
              echo "[OK] app online after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "[FAIL] app not online within 90s"
          tail -100 launch.log
          exit 1
      - name: Run E2E (exclude slow GPU generation)
        env:
          E2E_BASE_URL: http://127.0.0.1:8288
          # main push 上「生成基线」不是可接受的结局：必须拿基线真比对，
          # 否则这条 job 永远是绿色的空转（视觉回归在 CI 里从未比过一个像素）。
          # PR 仍允许生成一次，把基线写进缓存供 main 复用。
          E2E_REQUIRE_BASELINE: ${{ github.event_name == 'push' }}
        run: |
          python -m pytest tests/e2e -m "e2e and not slow" -v --timeout=120 \
            --junitxml=e2e-junit.xml
      - name: Junit gate (E2E must actually run)
        if: always()
        run: |
          python scripts/check_junit_results.py \
            --junit e2e-junit.xml \
            --min-executed 20 \
            --allow-skip "基线快照已写入=1"
      - name: Upload snapshots (visual regression baseline, on fail)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-snapshots
          path: tests/e2e/__snapshots__/

  performance:
    name: Performance Benchmarks (CPU profile, fake engine)
    # 评估 §9-P0-5：E2E/performance 不应长期 if:false，至少用假引擎接入 CPU profile。
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-perf-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-perf-
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
      - name: Start application in background (fake engine, no GPU)
        env:
          IMM_FAKE_ENGINE: "1"
        # 同 e2e：有界轮询替代 sleep 5 + 单次 curl（基准测试对着半起的服务
        # 取样子会把 P95 测成好看的数字，比失败更糟）。
        run: |
          python app/clean_launch.py > launch.log 2>&1 &
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:8288/api/health 2>/dev/null | grep -q "ok"; then
              echo "[OK] app online after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "[FAIL] app not online within 90s"
          tail -100 launch.log
          exit 1
      - name: Run API latency benchmarks (CPU profile)
        env:
          IMM_FAKE_ENGINE: "1"
        # 测试体系评估 2026-09-04 P1：阈值判定（--strict 超标退出码 1）
        # + JSON 留档（upload-artifact），消除"跑完即弃、无消费方"问题。
        run: |
          python scripts/benchmark.py --strict --output benchmark_result.json
      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-result-${{ github.run_number }}
          path: benchmark_result.json
          if-no-files-found: warn

  config-refs:
    name: Config Field Refs Integrity (P0-1)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install gate dependencies (PyYAML + cryptography)
        # cryptography 不是可选的：本 job 末尾要跑清单验签，而
        # security/secret_key.py 里的 Ed25519 分支是函数内 import cryptography。
        # 缺它时 verify_manifest_signature() 会先吞掉 ImportError、再回退 HMAC
        # （需要本机 data/.imm_secret，CI 没有），最终返回 False —— 于是门禁在
        # 裸 CI 环境恒红，且报成"清单缺少有效签名"，指向完全错误的方向。
        run: pip install pyyaml cryptography
      - name: Check config field references
        run: python scripts/check_config_refs.py
      - name: Check integrity manifest freshness (GOTCHAS #15)
        # 按「检出代码」重算核心模块哈希并与入库清单对账，
        # 防止「清单先于同批代码变更生成 → 入库即过期」静默合入（2026-09-05 事故）
        run: python scripts/check_integrity_manifest.py

  startup-smoke:
    name: Startup Smoke (P0-1, fake engine)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
      - name: Run startup smoke (boot → health → fake task → shutdown)
        env:
          IMM_FAKE_ENGINE: "1"
        run: |
          python -m pytest tests/smoke/test_startup_smoke.py -v --timeout=120

  # ── P2-11：post-deploy smoke（起真实服务 → 跑 6 项检查 → 拆除）──
  post-deploy-smoke:
    name: Post-Deploy Smoke Drill (P2-11)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install uvicorn
      - name: Boot service (fake engine)
        env:
          IMM_FAKE_ENGINE: "1"
        run: |
          nohup python -m uvicorn app.integrated_app.app_server:app --host 127.0.0.1 --port 8288 > server.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8288/api/health >/dev/null 2>&1; then
              echo "[OK] service up after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "[FAIL] service not up within 60s"; tail -100 server.log; exit 1
      - name: Run post-deploy smoke
        # ⚠️ 这里刻意【不加】--require-real-output：
        #    本 job 用 IMM_FAKE_ENGINE=1 起服务，产物路径含 imm_fake，
        #    开启产物实体校验会 100% 失败。该 flag 只用于真实部署晋级门禁
        #    （deploy.yml:staging / bluegreen.sh smoke_full），见 docs/ops/staging_smoke.md。
        run: |
          python scripts/post_deploy_smoke.py \
            --base-url http://127.0.0.1:8288 \
            --timeout 15 --generation-timeout 120 \
            --output smoke_report.json
      - name: Upload smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-smoke-report
          path: smoke_report.json
      - name: Stop service
        if: always()
        run: pkill -f "uvicorn app.integrated_app" || true

  # ── P0-1：Dockerfile 入口可启动性门禁（后端服务设计评估报告）──────────
  # 根因：startup-smoke / post-deploy-smoke 均绕过 Dockerfile CMD，导致
  # CMD 指向不存在的 bin/clean_launch.py 这类错误在 CI 里结构性不可见。
  # 本 job 真实 build + run + 健康探针，把「镜像可构建但启动即崩」拦在 CI。
  # 说明：config_models 强制回环绑定，宿主机 -p 端口映射不通，故探针走 docker exec。
  docker-build-smoke:
    name: Docker Build & Start Smoke (P0-1)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t imm:ci .
      - name: Start container (fake engine)
        run: |
          docker run --rm -d --name imm_ci -e IMM_FAKE_ENGINE=1 imm:ci
      - name: Probe health (in-container)
        run: |
          for i in $(seq 1 90); do
            if docker exec imm_ci python -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8288/api/health', timeout=3)" 2>/dev/null; then
              echo "[OK] container healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "[FAIL] container not healthy within 90s"
          docker logs imm_ci 2>&1 | tail -100
          exit 1
      - name: Stop container
        if: always()
        run: docker stop imm_ci || true

  # ── 不可变版本 artifact（P1-10）────────────────────────────
  release-artifacts:
    name: Immutable Release Artifacts (P1-10)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # tests/release 经 tests/conftest.py 的 autouse fixture 间接 import
        # integrated_app.app_server（FastAPI 入口），需要 fastapi 及其运行依赖；
        # 该 job 仅做发布元数据校验，无需 torch，故只装轻量 web/运行时依赖
        # （全量 requirements.txt 含 torch，会超出本 job 10 分钟超时）。
        run: pip install pytest pytest-timeout pyyaml fastapi pydantic jinja2 numpy prometheus-client python-multipart pillow
      - name: Generate release metadata + SBOM
        # --no-model-hash：CI 无模型权重，跳过哈希以控制时长
        run: python scripts/build_release_metadata.py --version 0.0.0-ci --no-model-hash
      - name: Verify release metadata
        run: python scripts/build_release_metadata.py --verify
      - name: Compose must not use floating image tags
        run: |
          if grep -nE 'image:[[:space:]]*[^$]*:latest' docker-compose.yml docker-compose.release.yml docker-compose.bluegreen.yml; then
            echo "[FAIL] compose 引用了浮动 tag latest"
            exit 1
          fi
          grep -q 'IMAGE_TAG:?IMAGE_TAG' docker-compose.yml || {
            echo "[FAIL] docker-compose.yml 未强制要求不可变 IMAGE_TAG"; exit 1; }
          grep -q 'IMAGE_DIGEST:?IMAGE_DIGEST' docker-compose.release.yml || {
            echo "[FAIL] docker-compose.release.yml 未强制按 digest 固化镜像"; exit 1; }
          echo "PASS: 镜像引用已按 tag/digest 固定"
      - name: Release metadata unit tests
        run: python -m pytest tests/release -q --timeout=120
      # ── P2-12 blue-green 静态门禁 ──
      - name: Blue-green compose and script lint (P2-12)
        run: |
          python -c "import yaml; d=yaml.safe_load(open('docker-compose.bluegreen.yml')); assert set(d['services'])=={'imm-blue','imm-green'}, d['services'].keys()"
          bash -n scripts/deploy/bluegreen.sh
          for sub in deploy rollback promote-only status; do
            grep -q "\"$sub\"\|$sub)" scripts/deploy/bluegreen.sh || { echo "[FAIL] bluegreen.sh 缺少 $sub 子命令"; exit 1; }
          done
          grep -q 'FORBIDDEN_TAG_RE' scripts/deploy/bluegreen.sh || { echo "[FAIL] 未拒绝可变 tag"; exit 1; }
          grep -q 'do_rollback' scripts/deploy/bluegreen.sh || { echo "[FAIL] 缺少一键回滚"; exit 1; }
          echo "PASS: blue-green 静态检查通过"

  # ── 安全断言（部署安全红线，2026-08-17 新增） ──────────────────
  security-assertions:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: 禁止 0.0.0.0 监听
        run: |
          HITS=$(grep -rn --include='*.py' --include='*.bat' --include='*.sh' --include='*.yml' \
            -E "host[[:space:]]*=[[:space:]]*['\"]0\.0\.0\.0|--host[[:space:]]+0\.0\.0\.0" \
            app backend config.yaml start.bat start.sh 2>/dev/null | grep -v tests || true)
          if [ -n "$HITS" ]; then echo "FAIL: 发现 0.0.0.0 监听配置"; echo "$HITS"; exit 1; fi
          echo "PASS: 无 0.0.0.0 监听配置"
      - name: 入口文件一致性
        run: |
          test -f app/clean_launch.py || test -f backend/main.py || exit 1
          test -f requirements.txt
          echo "PASS: 入口与依赖清单存在"
      - name: 依赖锁存在性
        run: |
          test -f requirements-lock.txt || (echo "FAIL: 缺少 requirements-lock.txt" && exit 1)
          echo "PASS: 依赖锁存在"

  # 锁可解性门禁：文件存在 != 装得上。#6e9de9c 那次分组升级把
  # antlr4-python3-runtime 抬到 4.13.2，而 omegaconf==2.3.1 的 requires_dist
  # 明确要 antlr4-python3-runtime==4.9.*，锁入库后 pip 解析直接
  # ResolutionImpossible —— 上面那个 job 只校验文件存在，抓不到"成对针被拆开"。
  # 后果不止 CI：app/clean_launch.py 启动时就是按这份锁 pip install 的。
  lock-solvability:
    name: Lock Solvability (pip resolver dry-run)
    runs-on: ubuntu-24.04  # P0-1 第一步：required context 所在 job 钉死镜像，见 on: 注释
    timeout-minutes: 15
    env:
      # 历史遗留理由（2026-09-25 订正）：曾有一段时间锁里是 torchvision==0.28.0+cpu，
      # 该本地变体只发布在 PyTorch CPU 源，不给这个索引解析器会找不到版本。
      # 但当前锁里【已经没有任何 +cpu 针】：torch==2.14.0 / torchvision==0.29.0 /
      # torchaudio==2.11.0 全是纯 PyPI 针。最后一次含 +cpu 的锁变更是 5a18b59，
      # 其后 b709767 / 8134705 / cd1eb0f / 7fa3cc8 四次都去掉了（security.yml 的
      # pip-audit 同源注释同样待订正）。
      # env 保留不删：删它改变 pip 的候选索引集，属行为变更而非注释订正。
      PIP_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Resolve the whole lock without installing
        # --dry-run 跑完整依赖解析但不下载构建安装任何包；存在成对针冲突时
        # pip 以 ResolutionImpossible 退出非零，从而拦住不可解的锁落库。
        run: python -m pip install --dry-run --no-input --quiet --disable-pip-version-check -r requirements-lock.txt
      - name: Resolve declared floors together with the lock
        # 第二道：把 requirements.txt 的下限与锁的针放在一起解析。只锁自己可解并不够 ——
        # 若只回退锁而不同步源（本次就差点踩到），会出现 13 个包的"源下限高于锁针"
        # （cryptography/hypothesis/numpy/playwright/pydantic/python-dotenv/PyWavelets/
        # scipy/starlette/torch/torchvision/uvicorn[standard]/websockets）。
        # 用 pip 自己判而不是写正则解析：extras 形式如 uvicorn[standard] 极易被漏掉。
        # 本地实测该组合在当前态 rc=0，不会误红。
        run: python -m pip install --dry-run --no-input --quiet --disable-pip-version-check -r requirements.txt -r requirements-lock.txt
