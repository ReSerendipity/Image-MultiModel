name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g., v2.0.1)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  # ── 创建 GitHub Release ───────────────────────────────
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract version from tag
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          VERSION="${TAG#v}"
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Release tag: $TAG, version: $VERSION"

      # ── P1-10：不可变版本 artifact（SBOM + 来源元数据 + tag/digest 固化）──
      - name: Generate release metadata and SBOM
        id: meta
        run: |
          python scripts/build_release_metadata.py --version "${{ steps.version.outputs.tag }}"
          echo "image_tag=$(python -c "import json;print(json.load(open('release/build_metadata.json'))['image_tag'])")" >> $GITHUB_OUTPUT

      - name: Verify release metadata (strict)
        run: python scripts/build_release_metadata.py --verify --strict

      - name: Build image with immutable tag
        run: |
          docker build \
            --build-arg IMAGE_TAG=${{ steps.meta.outputs.image_tag }} \
            --build-arg GIT_SHA=${{ github.sha }} \
            --build-arg BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -t image-multimodel:${{ steps.meta.outputs.image_tag }} \
            -t image-multimodel:${{ github.sha }} \
            .

      - name: Pin image digest
        id: digest
        run: |
          # 本地构建的 digest 通过 docker inspect 取得；推送到 registry 后应改用
          # `docker buildx imagetools inspect` 重取并回写 .env，确保部署按 digest 固化。
          DIGEST=$(docker inspect --format='{{index .Id}}' image-multimodel:${{ steps.meta.outputs.image_tag }})
          echo "digest=$DIGEST" >> $GITHUB_OUTPUT
          python scripts/build_release_metadata.py \
            --version "${{ steps.version.outputs.tag }}" --digest "$DIGEST"
          echo "IMAGE_TAG / IMAGE_DIGEST:"; grep -E '^IMAGE_(TAG|DIGEST)=' .env

      - name: Run tests before release
        run: |
          pip install -r requirements.txt
          pip install pytest-cov pytest-asyncio pytest-timeout hypothesis factory-boy
          python -m pytest -q --tb=short

      - name: Build portable package (Windows)
        run: |
          echo "Note: Portable package build requires Windows runner."
          echo "Skipping portable package build in this workflow."
          echo "To build portable package, run scripts/pack_portable.ps1 on Windows."

      - name: Extract changelog for this version
        id: changelog
        run: |
          # Extract the changelog section for this version
          VERSION="${{ steps.version.outputs.version }}"
          # Use awk to extract the section between version headers
          awk -v ver="## \[${VERSION}\]" '
            $0 ~ ver { found=1; next }
            /^## \[/ && found { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          # If empty, use a default message
          if [ ! -s release_notes.md ]; then
            echo "Release ${VERSION}" > release_notes.md
          fi
          echo "Release notes extracted:"
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
          # SBOM 与来源元数据随 Release 发布，便于下游按 digest 校验与审计
          files: |
            release/sbom.json
            release/build_metadata.json

  # ── 桌面增量包（Windows）：打包 + Ed25519 签名 + 验签 + 壳静态检查 ──
  # 落地执行总结 §5-4：release.yml 扩展「构建壳 → 打包 app → 签名 → 分卷 → 上传」。
  # 本期自动化为增量包全链（纯 Python，CI 可稳定验证）；Tauri 壳在本 job 做
  # cargo check（静态门禁），完整 build 仍由本机发布流程执行（决策留痕）。
  # 真实模型分卷（split_release_volumes.py）依赖发布侧模型资产，CI 无模型，跳过。
  desktop-package:
    name: Build & sign desktop incremental package
    runs-on: windows-latest
    needs: release
    # Windows runner 控制台默认 cp1252，脚本中文 print 会 UnicodeEncodeError
    # （v1.3.0 tag 推送实测：freshness gate 步骤崩溃）。统一强制 UTF-8 输出。
    env:
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python deps
        run: pip install pyyaml cryptography

      - name: Verify integrity manifest (freshness gate)
        run: python scripts/check_integrity_manifest.py

      - name: Inject manifest signing key
        shell: bash
        env:
          KEY_B64: ${{ secrets.MANIFEST_SIGNING_KEY_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::MANIFEST_SIGNING_KEY_B64 未配置，增量包将以 --no-sign 构建（调试产物）"
            exit 0
          fi
          mkdir -p data
          echo "$KEY_B64" | base64 -d > data/.manifest_signing_key

      - name: Build & sign app package
        shell: bash
        run: |
          if [ -f data/.manifest_signing_key ]; then
            python scripts/package_app.py
          else
            python scripts/package_app.py --no-sign
          fi

      - name: Verify package Ed25519 signature
        shell: bash
        run: |
          if [ -f data/.manifest_signing_key ]; then
            python -c "from app.integrated_app.security.secret_key import verify_manifest_signature_ed25519; import glob; z=glob.glob('release/packages/app-v*.zip')[0]; assert verify_manifest_signature_ed25519(z), '增量包 Ed25519 验签失败'"
          else
            echo "::warning::跳过验签（无私钥）"
          fi

      - name: Run portable diagnostics
        run: python scripts/diag_portable_verify.py

      - name: Rust toolchain (desktop shell static check)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cargo check (desktop shell)
        working-directory: desktop/src-tauri
        run: cargo check --locked

      - name: Upload desktop release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: |
            release/packages/*

  # ── 发布后通知 ─────────────────────────────────────────
  notify:
    name: Release Notification
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Print release info
        run: |
          echo "Release ${{ needs.release.outputs.tag }} published successfully."
          echo "Next steps:"
          echo "  1. Build portable package on Windows: scripts/pack_portable.ps1"
          echo "  2. Upload portable package to the GitHub Release"
          echo "  3. Update documentation if needed"
